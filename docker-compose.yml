services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    volumes:
      - whisper-cache:/data   # persistent Whisper model cache + session
    environment:
      - TEMP_DIRECTORY=/tmp/jobs
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket,os; p=os.environ.get(\"PORT\"); exit(0) if not p else socket.create_connection((\"127.0.0.1\", int(p)), 3)'"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  whisper-cache:
